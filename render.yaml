# Render 部署配置（可选，也可以手动在 UI 里填）
# 使用方法：render.com 控制台 → New → Blueprint → 选这个仓库 → 自动识别

services:
  - type: web
    name: ai-org-server
    runtime: node
    rootDir: ai-org-server
    plan: free
    region: singapore
    branch: main
    buildCommand: pnpm install && pnpm db:generate && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: /tmp/uploads-ai-org
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: DATABASE_URL
        sync: false  # ⚠️ 在 Render UI 里手动填
      - key: JWT_SECRET
        sync: false  # ⚠️ 在 Render UI 里手动填
      - key: CORS_ORIGINS
        sync: false  # ⚠️ 在 Render UI 里手动填
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false  # ⚠️ 在 Render UI 里手动填
      - key: ADMIN_EMAIL
        value: admin@your-domain.com
