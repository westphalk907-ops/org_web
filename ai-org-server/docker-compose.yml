  #       postgres:
  #         condition: service_healthy
  #
  # 启动：
  #   cp .env.example .env   # 填入真实值
  #   docker compose up -d --build
  # ---------------------------------------------------------------

volumes:
  postgres_data:
    name: ai-org-postgres-data
