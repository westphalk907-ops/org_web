# =====================================================================
# Railway / Nixpacks 配置
# =====================================================================
# 让 Railway 自动识别并启用 pnpm，避免 "pnpm: not found" 错误
# =====================================================================

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm-9_x"]

[phases.install]
cmds = ["corepack enable", "pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm db:generate", "pnpm build"]

[start]
cmd = "pnpm exec prisma migrate deploy && node dist/index.js"